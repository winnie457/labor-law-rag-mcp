# Modular RAG MCP Server - Configuration
# Generated for the current setup: DeepSeek LLM, Qwen embeddings, Ollama vision, and cross-encoder reranking.

llm:
  provider: "deepseek"
  model: "deepseek-chat"
  deployment_name: ""
  azure_endpoint: ""
  api_version: ""
  api_key: "${DEEPSEEK_API_KEY}"
  base_url: "https://api.deepseek.com"
  temperature: 0.0
  max_tokens: 4096

embedding:
  provider: "qwen"
  model: "text-embedding-v3"
  dimensions: 1024
  azure_endpoint: ""
  deployment_name: ""
  api_version: ""
  api_key: "${QWEN_API_KEY}"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"

vision_llm:
  enabled: true
  provider: "ollama"
  model: "llava"
  azure_endpoint: ""
  deployment_name: ""
  api_version: ""
  api_key: ""
  base_url: "http://localhost:11434"
  max_image_size: 2048

vector_store:
  provider: "chroma"
  persist_directory: "./data/db/chroma"
  collection_name: "knowledge_hub"
  # Keep HNSW vectors in the sqlite log. chromadb 1.5.9 fails to reload the
  # flushed HNSW index in this environment, which makes a freshly started
  # process (CLI evaluation, MCP server) unable to query the collection.
  # For <=100k chunks the replay cost is negligible; raise this if you later
  # upgrade chromadb to a version that reloads persisted HNSW indexes.
  hnsw_sync_threshold: 1000000

retrieval:
  dense_top_k: 50
  sparse_top_k: 50
  fusion_top_k: 30
  rrf_k: 5
  dense_weight: 2.0
  sparse_weight: 1.0

rerank:
  enabled: false
  provider: "cross_encoder"
  model: "BAAI/bge-reranker-base"
  top_k: 5

evaluation:
  enabled: false
  provider: "custom"
  metrics:
    - "hit_rate"
    - "mrr"
    - "faithfulness"

observability:
  log_level: "INFO"
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true

ingestion:
  chunk_size: 500
  chunk_overlap: 100
  splitter: "recursive"
  batch_size: 100
  chunk_refiner:
    use_llm: false
  metadata_enricher:
    use_llm: false
